<canvas id="c"></canvas>
<script>
// Mulberry32 seeded PRNG
function makeRng(seed) {
  seed = seed >>> 0;
  return function() {
    seed = (seed + 0x6D2B79F5) >>> 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function parseFragment() {
  const p = {};
  return p;
  for (const part of location.hash.slice(1).split('&')) {
    const eq = part.indexOf('=');
    if (eq > 0) p[part.slice(0, eq)] = part.slice(eq + 1);
  }
  return p;
}

function main() {
  const frag = parseFragment();

  // Resolve seed first — everything else flows from it
  const seed = frag.seed !== undefined
    ? (frag.seed >>> 0)
    : ((Math.random() * 2 ** 32) >>> 0);
  const rng = makeRng(seed);

  // Constants — fragment params override, otherwise seeded-random
  // const NUM_PARTICLES    = frag.n   !== undefined ? +frag.n   : Math.floor(rng() * 10000) + 10000;
  // const NUM_PARTICLES    = frag.n   !== undefined ? +frag.n   : Math.floor(rng() * 10000) + 5000;
  const NUM_PARTICLES    = Math.floor(rng() * 30000) + 5000;
  // const NUM_PARTICLES    = 10000*4;
  const NUM_POPULATIONS  = frag.p   !== undefined ? +frag.p   : Math.floor(rng() * 5) + 3;
  // const NUM_POPULATIONS  = 6.0;
  const MUTATION_CHANCE  = frag.m   !== undefined ? +frag.m   : 0;
  // const BASE_SPEED       = frag.s   !== undefined ? +frag.s   : rng() * 0.01;
  const BASE_SPEED       = .00025;
  const LOOKAHEAD_PX     = frag.l   !== undefined ? +frag.l   : Math.floor(rng() * 25) + 8;
  const PRESENCE_PAD     = .01;
  const COLLISION_THRESH = frag.ct  !== undefined ? +frag.ct  : 0.016;
  const GRAYSCALE        = frag.gs  !== undefined ? +frag.gs  : 0;
  const HUE_SHIFT        = frag.hue !== undefined ? +frag.hue : rng(); // seed-based color mood

  // Stamp all resolved values into the URL so it's bookmarkable
  history.replaceState(null, '', '#' + [
    `seed=${seed}`,
    `n=${NUM_PARTICLES}`,
    `p=${NUM_POPULATIONS}`,
    `m=${MUTATION_CHANCE}`,
    `s=${BASE_SPEED.toFixed(6)}`,
    `l=${LOOKAHEAD_PX}`,
    `pad=${PRESENCE_PAD}`,
    `ct=${COLLISION_THRESH}`,
    `gs=${GRAYSCALE}`,
    `hue=${HUE_SHIFT.toFixed(4)}`,
  ].join('&'));

  console.log({ seed, NUM_PARTICLES, NUM_POPULATIONS, MUTATION_CHANCE, BASE_SPEED, LOOKAHEAD_PX, PRESENCE_PAD, COLLISION_THRESH, GRAYSCALE, HUE_SHIFT });

  // Space = randomize: pick a new seed, let everything else regenerate from it
  window.addEventListener('keydown', e => {
    if (e.key === ' ') {
      e.preventDefault();
      location.hash = 'seed=' + ((Math.random() * 2 ** 32) >>> 0);
      location.reload();
    }
  });

  // ======================== WEBGL SETUP ========================

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: false });
  if (!gl) { alert('No WebGL'); throw new Error('No WebGL'); }

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function compileShader(src, type) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      throw new Error('Shader compile failed');
    }
    return s;
  }

  function createProgram(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(vsSrc, gl.VERTEX_SHADER));
    gl.attachShader(p, compileShader(fsSrc, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error(gl.getProgramInfoLog(p));
      throw new Error('Program link failed');
    }
    return p;
  }

  // =================== PASS 1: PRESENCE MAP ===================
  // Renders particles into a half-res texture with additive blending.
  // R = count, G = color sum, B = size sum, A = speed sum (all scaled).

  const presenceVS = `attribute float a_index;
uniform sampler2D u_state;
uniform vec2 u_texSize;
uniform float u_pad;
varying float v_color;
varying float v_size;
varying float v_speed;

void main() {
  float row = floor(a_index / u_texSize.x);
  float col = a_index - row * u_texSize.x;
  vec2 uv = vec2((col + 0.5) / u_texSize.x, (row + 0.5) / u_texSize.y);
  vec4 data = texture2D(u_state, uv);
  float x = data.r * 2.0 - 1.0;
  float y = data.g * 2.0 - 1.0;

  // Unpack B channel: color*16 + direction
  float packed_b = floor(data.b + 0.5);
  v_color = floor(packed_b / 16.0);

  // Unpack A channel: size*8 + speed
  float packed_a = floor(data.a + 0.5);
  v_size = floor(packed_a / 8.0);
  v_speed = packed_a - v_size * 8.0;

  gl_Position = vec4(x, y, 0.0, 1.0);
  gl_PointSize = v_size + 1.0 + u_pad;
}
`;
  const presenceFS = `precision mediump float;
varying float v_color;
varying float v_size;
varying float v_speed;

void main() {
  vec2 c = gl_PointCoord - 0.5;
  if (dot(c, c) > 0.25) discard;

  // Encode aggregate data for additive blending (UNSIGNED_BYTE texture)
  // Scale values small enough to avoid saturation with ~64 overlapping particles
  float count_inc = 1.0 / 64.0;
  float color_inc = (v_color + 0.5) / (16.0 * 64.0);
  float size_inc  = (v_size + 0.5) / (8.0 * 64.0);
  float speed_inc = (v_speed + 0.5) / (8.0 * 64.0);

  gl_FragColor = vec4(count_inc, color_inc, size_inc, speed_inc);
}`;

  const presenceProg    = createProgram(presenceVS, presenceFS);
  const u_pres_state    = gl.getUniformLocation(presenceProg, 'u_state');
  const u_pres_texSize  = gl.getUniformLocation(presenceProg, 'u_texSize');
  const u_pres_pad      = gl.getUniformLocation(presenceProg, 'u_pad');
  const a_pres_index    = gl.getAttribLocation(presenceProg, 'a_index');

  // =================== PASS 2: UPDATE ===================
  // Reads state + presence. 8-dir movement, dodging, collision, mutation.

  const updateVS = `attribute vec2 a_pos;
varying vec2 v_uv;
void main() {
  v_uv = a_pos * 0.5 + 0.5;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;
  const updateFS = `precision highp float;
// varying float v_colorIndex;
varying vec2 v_uv;
uniform sampler2D u_state;
uniform sampler2D u_presence;
uniform float u_baseSpeed;
uniform vec2 u_resolution;
uniform float u_lookahead;
uniform float u_time;
uniform float u_mutationChance;
uniform float u_collisionThresh;

const float PI = 3.14159265359;


float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}


// Direction index 0-15 -> movement vector (22.5° steps)
vec2 dirVec(float dir) {
  float angle = dir * PI / 8.0;
  return vec2(sin(angle), cos(angle));
}

float clrIndex(float b) {
    float _packed_b = floor(b + 0.5);
    return floor( _packed_b / 16.0 );

}

void main() {
  vec4 data = texture2D(u_state, v_uv);
  float x = data.r;
  float y = data.g;
  float packed_b = floor(data.b + 0.5);
  float curClr = clrIndex(data.b);
  // v_colorIndex = floor(packed_b / 16.0);  // 0-15

  // Unpack B channel: color*16 + direction
  float color = floor(packed_b / 16.0);
  float direction = packed_b - color * 16.0;

  // Unpack A channel: integer part = size*8 + speed, fractional part = energy
  float intPart = floor(data.a);
  float size = floor(intPart / 8.0);
  float speed = (intPart - size * 8.0)+.2;

  // === MOVEMENT ===
  vec2 moveDir = dirVec(direction);
  float speedMul = speed; // 0.5 to 2.0

  // Convert lookahead from pixels to UV space
  vec2 laUV = vec2(u_lookahead / u_resolution.x, u_lookahead / u_resolution.y);

  // Sample presence map ahead
  vec2 ahead = fract(vec2(x, y) + moveDir * laUV + 1.0);
  vec4 presAhead = texture2D(u_presence, ahead);
  float clrAhead = clrIndex(presAhead.b);

  bool collided = false;
 // 0 and 2 are friends, 1 and 3 are foes
  float dirModifier = 1.0;
  if (presAhead.r > u_collisionThresh) {
    if(clrAhead < curClr ){ 
      dirModifier = -1.0;
        // collided = true;
        // x = 1.0;
        // y = 1.0;
        // x += moveDir.x * 22.0;
        // y += moveDir.y * 22.0;

    } else {
      dirModifier = 0.0;
        // collided = true;
        // x = 0.0;
        // y = 0.0;
    }
  }
    x += dirVec(direction * dirModifier).x * u_baseSpeed * speedMul;
    y += dirVec(direction * dirModifier).y * u_baseSpeed * speedMul;
  // if( curClr == 0.0 ) {
  //   // x += 20.0;
  //   x += u_baseSpeed * speedMul;
  // } else if( curClr == 1.0 ) { 
  //   x -= u_baseSpeed * speedMul;
  // } else if( curClr == 2.0 ) {
  //   y += u_baseSpeed * speedMul;
  // } else if( curClr == 3.0 ) {
  //   y -= u_baseSpeed * speedMul;
  // } 
      // collided = true;
      // x = 1.0;
      // y = 1.0;
      // x += moveDir.x * 22.0;
      // y += moveDir.y * 22.0;
  // Obstacle threshold: more than ~1 particle ahead
  // if (presAhead.r > u_collisionThresh) {
  //   float dodgeChance = hash(vec2(v_uv.x, 0.123)) * 0.6;
  //   float dodgeRoll = hash(vec2(v_uv.x, u_time));

  //   if (dodgeRoll < dodgeChance) {
  //     float sideRoll = hash(vec2(v_uv.x, u_time * 2.0));
  //     float dodgeDir = sideRoll < 0.5
  //       ? mod(direction + 4.0, 16.0)
  //       : mod(direction + 12.0, 16.0);

  //     vec2 dodgeMoveDir = dirVec(dodgeDir);
  //     vec2 dodgeAhead = fract(vec2(x, y) + dodgeMoveDir * laUV + 1.0);
  //     vec4 presDodge = texture2D(u_presence, dodgeAhead);

  //     if (presDodge.r < 1.0 / 64.0) {
  //       x += dodgeMoveDir.x * u_baseSpeed * speedMul;
  //       y += dodgeMoveDir.y * u_baseSpeed * speedMul;
  //     } else {
  //       collided = true;
  //       x += moveDir.x * u_baseSpeed * speedMul;
  //       y += moveDir.y * u_baseSpeed * speedMul;
  //     }
  //   } if(clrAhead == curClr ){ 
  //       collided = true;
  //       // x = 1.0;
  //       // y = 1.0;
  //       // x += moveDir.x * 22.0;
  //       // y += moveDir.y * 22.0;

  //   }else {
  //     collided = true;
  //       // x = 0.0;
  //       // y = 0.0;
  //     // x += moveDir.x * u_baseSpeed * speedMul;
  //     // y += moveDir.y * u_baseSpeed * speedMul;
  //   }
  // } else {
  //   x += moveDir.x * u_baseSpeed * speedMul;
  //   y += moveDir.y * u_baseSpeed * speedMul;
  // }

  // Toroidal wrapping
  x = fract(x + 1.0);
  y = fract(y + 1.0);

  // === COLLISION EFFECTS ===
  if (collided) {
    // Energy cost from collision

    // Mutation on collision (existing mechanic)
  }

  // === FLOCKING BONUS ===
  // Sample presence at current position for neighbor info



  // Re-pack
  float new_b = color * 16.0 + direction;
  float new_a = floor(size * 8.0 + speed);
  // x = 1.0;
  // y = 1.0;
  gl_FragColor = vec4(x, y, new_b, new_a);
}

// file:///Users/skaufman/opencoder/projects/shaders/dots/dist/index.html#seed=3795771992&n=14478&p=3&m=0&s=0.001000&l=13&pad=1.01&ct=0.016&gs=1&hue=0.9163`;

  const updateProg             = createProgram(updateVS, updateFS);
  const u_update_state         = gl.getUniformLocation(updateProg, 'u_state');
  const u_update_presence      = gl.getUniformLocation(updateProg, 'u_presence');
  const u_update_baseSpeed     = gl.getUniformLocation(updateProg, 'u_baseSpeed');
  const u_update_resolution    = gl.getUniformLocation(updateProg, 'u_resolution');
  const u_update_lookahead     = gl.getUniformLocation(updateProg, 'u_lookahead');
  const u_update_time          = gl.getUniformLocation(updateProg, 'u_time');
  const u_update_mutationChance   = gl.getUniformLocation(updateProg, 'u_mutationChance');
  const u_update_collisionThresh  = gl.getUniformLocation(updateProg, 'u_collisionThresh');
  const a_update_pos           = gl.getAttribLocation(updateProg, 'a_pos');

  // =================== PASS 3: RENDER ===================

  const renderVS = `attribute float a_index;
uniform sampler2D u_state;
uniform vec2 u_texSize;
varying float v_colorIndex;
varying float v_speed;

void main() {
  float row = floor(a_index / u_texSize.x);
  float col = a_index - row * u_texSize.x;
  vec2 uv = vec2((col + 0.5) / u_texSize.x, (row + 0.5) / u_texSize.y);
  vec4 data = texture2D(u_state, uv);
  float x = data.r * 2.0 - 1.0;
  float y = data.g * 2.0 - 1.0;

  // Unpack B channel: color*16 + direction
  float packed_b = floor(data.b + 0.5);
  v_colorIndex = floor(packed_b / 16.0);  // 0-15

  // Unpack A channel: integer part = size*8 + speed, fractional part = energy
  float intPart = floor(data.a);
  float sz = floor(intPart / 8.0);    // 0-7
  float size = (floor(intPart / 8.0)+1.0)/2.0;    // 0-7
  // float size = 3.0;
  v_speed = intPart - sz * 8.0;

  gl_Position = vec4(x, y, 0.0, 1.0);
  gl_PointSize = size + 1.0;  // 1-8 pixels
}
`;
  const renderFS = `precision mediump float;
varying float v_colorIndex;
varying float v_speed;
uniform float u_grayscale;
uniform float u_hueShift;

vec3 hsv2rgb(vec3 c) {
  vec3 p = abs(fract(c.xxx + vec3(0.0, 2.0/3.0, 1.0/3.0)) * 6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}

vec3 paletteColor(float index, float val) {
  // Golden ratio hue steps — maximally perceptually distinct colors
  float hue = fract(index * 0.618033988 + u_hueShift);
  // Full saturation always; brightness lives in HSV value so hue stays pure
  return hsv2rgb(vec3(hue, 1.0, val));
}

void main() {
  vec2 c = gl_PointCoord - 0.5;
  if (dot(c, c) > 0.25) discard;

  // 0.5–1.0 range: even the slowest particles are half-bright, not muddy
  float val = 0.5 + 0.5 * clamp(v_speed / 7.0, 0.0, 1.0);

  vec3 col;
  if (u_grayscale > 0.5) {
    col = vec3(val);
  } else {
    col = paletteColor(v_colorIndex, val);
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

  const renderProg            = createProgram(renderVS, renderFS);
  const u_render_state        = gl.getUniformLocation(renderProg, 'u_state');
  const u_render_texSize      = gl.getUniformLocation(renderProg, 'u_texSize');
  const u_render_grayscale    = gl.getUniformLocation(renderProg, 'u_grayscale');
  const u_render_hueShift     = gl.getUniformLocation(renderProg, 'u_hueShift');
  const a_render_index        = gl.getAttribLocation(renderProg, 'a_index');

  // Set render constants once (don't change per frame)
  gl.useProgram(renderProg);
  gl.uniform1f(u_render_grayscale, GRAYSCALE);
  gl.uniform1f(u_render_hueShift, HUE_SHIFT);

  // ======================== BUFFERS ========================

  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  const indices = new Float32Array(NUM_PARTICLES);
  for (let i = 0; i < NUM_PARTICLES; i++) indices[i] = i;
  const indexBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
  gl.bufferData(gl.ARRAY_BUFFER, indices, gl.STATIC_DRAW);

  // ======================== TEXTURES ========================

  const extFloat = gl.getExtension('OES_texture_float');
  if (!extFloat) { alert('OES_texture_float required'); throw new Error(); }
  gl.getExtension('WEBGL_color_buffer_float');

  const texWidth  = Math.ceil(Math.sqrt(NUM_PARTICLES));
  const texHeight = Math.ceil(NUM_PARTICLES / texWidth);

  const initData = new Float32Array(texWidth * texHeight * 4);

  // Population templates — all randomness routes through seeded rng
  const populations = [];
  for (let p = 0; p < NUM_POPULATIONS; p++) {
    populations.push({
      color:     Math.floor(rng() * 3),  // 0-2
      // color:     Math.floor(rng() * 16),  // 0-15
      direction: Math.floor(rng() * 16),  // 0-15
      size:      Math.floor(rng() * 8),   // 0-7
      speed:     Math.floor(rng() * 8),   // 0-7
    });
  }
  console.log('Populations:', populations);

  for (let i = 0; i < NUM_PARTICLES; i++) {
    const b   = i * 4;
    const pop = populations[i % NUM_POPULATIONS];
    initData[b + 0] = rng();                                        // x
    initData[b + 1] = rng();                                        // y
    initData[b + 2] = pop.color * 16 + pop.direction;              // packed color+direction
    initData[b + 3] = Math.floor(pop.size * 8 + pop.speed);        // packed size+speed
  }

  function makeTex(data, w, h, type, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }

  function makeFBO(tex) {
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return fbo;
  }

  // Ping-pong state textures
  let texA = makeTex(initData, texWidth, texHeight, gl.FLOAT, gl.NEAREST);
  let texB = makeTex(null,     texWidth, texHeight, gl.FLOAT, gl.NEAREST);
  let fboA = makeFBO(texA);
  let fboB = makeFBO(texB);
  let readTex = texA, writeFBO = fboB;

  function swap() {
    if (readTex === texA) { readTex = texB; writeFBO = fboA; }
    else                  { readTex = texA; writeFBO = fboB; }
  }

  // Presence buffer (recreated on resize)
  let presW = 0, presH = 0, presTex = null, presFBO = null;

  function ensurePresence() {
    const w = Math.ceil(canvas.width  / 2);
    const h = Math.ceil(canvas.height / 2);
    if (w === presW && h === presH) return;
    presW = w; presH = h;
    if (presTex) gl.deleteTexture(presTex);
    if (presFBO) gl.deleteFramebuffer(presFBO);
    presTex = makeTex(null, presW, presH, gl.UNSIGNED_BYTE, gl.LINEAR);
    presFBO = makeFBO(presTex);
  }

  // ======================== LOOP ========================

  function frame() {
    ensurePresence();

    // --- Pass 1: Presence ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, presFBO);
    gl.viewport(0, 0, presW, presH);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);

    gl.useProgram(presenceProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, readTex);
    gl.uniform1i(u_pres_state, 0);
    gl.uniform2f(u_pres_texSize, texWidth, texHeight);
    gl.uniform1f(u_pres_pad, PRESENCE_PAD);
    gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
    gl.enableVertexAttribArray(a_pres_index);
    gl.vertexAttribPointer(a_pres_index, 1, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, NUM_PARTICLES);
    gl.disable(gl.BLEND);

    // --- Pass 2: Update ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, writeFBO);
    gl.viewport(0, 0, texWidth, texHeight);

    gl.useProgram(updateProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, readTex);
    gl.uniform1i(u_update_state, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, presTex);
    gl.uniform1i(u_update_presence, 1);
    gl.uniform1f(u_update_baseSpeed, BASE_SPEED);
    gl.uniform2f(u_update_resolution, canvas.width, canvas.height);
    gl.uniform1f(u_update_lookahead, LOOKAHEAD_PX);
    gl.uniform1f(u_update_time, performance.now() * 0.001);
    gl.uniform1f(u_update_mutationChance, MUTATION_CHANCE);
    gl.uniform1f(u_update_collisionThresh, COLLISION_THRESH);

    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(a_update_pos);
    gl.vertexAttribPointer(a_update_pos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    swap();

    // --- Pass 3: Draw to screen ---
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.useProgram(renderProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, readTex);
    gl.uniform1i(u_render_state, 0);
    gl.uniform2f(u_render_texSize, texWidth, texHeight);
    gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
    gl.enableVertexAttribArray(a_render_index);
    gl.vertexAttribPointer(a_render_index, 1, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, NUM_PARTICLES);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
}

main();
